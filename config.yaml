current_base: MEX

defaults:
  market: us
  currency: usd

corridors:
  # Paused 2026-09-12 (not flying this way soon) — alerts_enabled: false keeps
  # pricing/data collection running (so the history isn't lost) but suppresses
  # all alerts for these three. Flip back to true (or delete the line) to
  # resume notifications.
  - origin: "{BASE}"
    destination: YYZ
    date_windows: ["2026-07-10:2026-08-31"]   # any day through end of Aug, one-way
    trip_type: one_way
    cabin: economy
    max_price: 350                     # estimate — adjust once you see real fares
    currency: usd
    alert_threshold: 250
    flex_days: 3
    alerts_enabled: false

  - label: "YVR-LON one-way"
    origin: YVR
    destination: LON                   # city-level: LHR/LGW/STN/LTN/LCY all count
    date_windows: ["2026-09-01:2026-12-31"]   # Sep onwards, any day, one-way
    trip_type: one_way
    cabin: economy
    max_price: 700                     # estimate — adjust once you see real fares
    currency: usd
    alert_threshold: 550
    flex_days: 3
    alerts_enabled: false

  - label: "YVR-LON return"
    origin: YVR
    destination: LON
    date_windows: ["any Fri-Mon in 2026-09", "any Fri-Mon in 2026-10",
                   "any Fri-Mon in 2026-11", "any Fri-Mon in 2026-12"]
    trip_type: return
    cabin: economy
    max_price: 1200                    # estimate — adjust once you see real fares
    currency: usd
    alert_threshold: 950
    flex_days: 3
    alerts_enabled: false

  # --- UK -> Perth exploration (added 2026-09-10) ---
  # Any routing/layover — Tier 1 (Travelpayouts) has no stopover-airport
  # control and no itinerary/segment data, so this can't distinguish "decent
  # layover" from "brutal 3-stop grind"; it's price + date only. Manual
  # itinerary check-before-booking is on Rich once an alert fires. LON is the
  # Travelpayouts metro code (covers LHR/LGW/STN/LTN/LCY).
  # Baseline observed 2026-09-10 (GBP, for reference — this config runs in USD):
  # off-peak budget multi-stop ~£350-530 one-way; Qatar via Doha ~£870-960 one-way
  # at Dec 28-30 peak; direct Qantas ~£1030-1330 one-way. Thresholds below are
  # estimates from that — adjust once real alerts come in.
  - label: "LON-PER one-way"
    origin: LON
    destination: PER
    date_windows: ["2026-10-10:2027-01-15"]
    trip_type: one_way
    cabin: economy
    max_price: 750
    currency: usd
    alert_threshold: 550
    flex_days: 3

  - label: "LON-PER return (~180d, furthest-out return)"
    origin: LON
    destination: PER
    # Fixed-stay "+N" grammar (added 2026-09-10) — the weekly "any Dow-Dow"
    # form only spans up to 7 days, too short for a long-haul AUS trip.
    # 180 days (updated 2026-09-12, was 21d) per Rich: book the furthest-out
    # return date and check whether it's close in price to one-way — not a
    # real constraint on actual return dates.
    date_windows: ["2026-10-10:2027-01-15 +180"]
    trip_type: return
    cabin: economy
    max_price: 1400
    currency: usd
    alert_threshold: 1100
    flex_days: 3

  # --- East-coast AUS destinations (added 2026-09-12) ---
  # Same Tier 1 caveats as Perth above: price/date only, no stopover detail.
  # Baseline one-way floors observed 2026-09-12 (USD, off-peak, 1-stop via
  # China Eastern/China Southern/Air China): SYD ~546-620, MEL ~500-620,
  # BNE ~548-670. Thresholds below are estimates from that.
  - label: "LON-SYD one-way"
    origin: LON
    destination: SYD
    date_windows: ["2026-10-10:2027-01-15"]
    trip_type: one_way
    cabin: economy
    max_price: 720
    currency: usd
    alert_threshold: 520
    flex_days: 3

  - label: "LON-SYD return (~180d, furthest-out return)"
    origin: LON
    destination: SYD
    date_windows: ["2026-10-10:2027-01-15 +180"]
    trip_type: return
    cabin: economy
    max_price: 1400
    currency: usd
    alert_threshold: 1100
    flex_days: 3

  - label: "LON-MEL one-way"
    origin: LON
    destination: MEL
    date_windows: ["2026-10-10:2027-01-15"]
    trip_type: one_way
    cabin: economy
    max_price: 700
    currency: usd
    alert_threshold: 500
    flex_days: 3

  - label: "LON-MEL return (~180d, furthest-out return)"
    origin: LON
    destination: MEL
    date_windows: ["2026-10-10:2027-01-15 +180"]
    trip_type: return
    cabin: economy
    max_price: 1400
    currency: usd
    alert_threshold: 1100
    flex_days: 3

  - label: "LON-BNE one-way"
    origin: LON
    destination: BNE
    date_windows: ["2026-10-10:2027-01-15"]
    trip_type: one_way
    cabin: economy
    max_price: 720
    currency: usd
    alert_threshold: 520
    flex_days: 3

  - label: "LON-BNE return (~180d, furthest-out return)"
    origin: LON
    destination: BNE
    date_windows: ["2026-10-10:2027-01-15 +180"]
    trip_type: return
    cabin: economy
    max_price: 1400
    currency: usd
    alert_threshold: 1100
    flex_days: 3

deadline_watches:
  - label: "LON-PER for NYE"
    destination: PER
    origin: LON                        # explicit — don't inherit current_base (MEX)
    earliest_depart: "2026-12-20"
    must_arrive_by: "2026-12-31"
    max_price: 850                     # USD — below the ~$1,100-1,220 Doha peak fare observed
    currency: usd

  # Strawberry Fields Festival 2026: 20-22 Nov, The Wildlands, Tocumwal NSW
  # (Murray River, NSW/VIC border) — no airport there; nearest gateways are
  # Melbourne (~260km/~3h drive) and Sydney (~580km/~6h drive). Watching both,
  # arrive by the 19th to allow travel time. https://www.strawberry-fields.com.au/
  - label: "LON-MEL for Strawberry Fields"
    destination: MEL
    origin: LON
    earliest_depart: "2026-11-10"
    must_arrive_by: "2026-11-19"
    max_price: 600
    currency: usd

  - label: "LON-SYD for Strawberry Fields"
    destination: SYD
    origin: LON
    earliest_depart: "2026-11-10"
    must_arrive_by: "2026-11-19"
    max_price: 620
    currency: usd

  # Paused 2026-09-12 — see corridors comment above; same alerts_enabled: false.
  - destination: LON                   # one-way, back in London on or before the date
    origin: "{BASE}"                   # optional; defaults to current_base
    origin_variants: [GDL, CUN, MTY]    # also check Guadalajara, Cancún, Monterrey
    earliest_depart: "2026-07-24"       # don't search/alert on departures before this
    must_arrive_by: "2026-07-27"
    max_price: 650
    currency: usd
    alerts_enabled: false

  - destination: MAN                   # "get me home to Manchester by X, under Y"
    origin: "{BASE}"                   # optional; defaults to current_base
    must_arrive_by: "2026-12-24"
    max_price: 650
    currency: usd
    alerts_enabled: false

# Paused 2026-09-12, same reason — MEX/PVR discovery isn't AUS, so it's muted
# too even though it's not one of the named "MEX/Canada routes". Data (the
# shortlist) still gets fetched and dashboarded; only the median-based
# discovery alerts are suppressed.
inspiration:
  origins: ["{BASE}", "PVR"]
  domestic_origin: PVR                 # domestic shortlist departs PVR; international stays {BASE}
  horizon_weeks: 8
  price_ceiling: 450
  currency: usd
  market: us
  region_whitelist: []                 # [] = anywhere; else [US, MX, GB] or explicit [BKK, MAD]
  top_n_to_verify: 10
  alerts_enabled: false

cost_guardrails:
  max_duffel_searches_per_day: 100
  duffel_cost_per_search_usd: 0.005

alerting:
  telegram: {enabled: true}
  smtp: {enabled: false}
  digest_mode: false
  median_lookback_days: 30
  median_alert_ratio: 0.80             # alert if price < 80% of trailing median
  median_min_samples: 5
  dedupe_window_hours: 24
  dedupe_band_width: 20                 # currency-unit width of a dedupe price band

# Tier 2 (Duffel) live-mode double gate. Leave false until you confirm billing.
duffel:
  live_confirmed: false

awards:
  enabled: false                       # seats.aero Pro award-space module (optional, Phase 2)
